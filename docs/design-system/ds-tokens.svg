<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1240" width="1600" height="1240">
  <rect width="1600" height="1240" fill="#0B0B0D"/>
  <text x="60" y="70" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="30"
        font-weight="700" fill="#F7F7F8">Beecord 设计令牌（Design Tokens）</text>
  <text x="60" y="98" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="14"
        fill="#8E8E93">DESIGN_SYSTEM.md §1 · 实现唯一取值来源 · 2026-10-14</text>

  <!-- ① 色彩令牌 -->
  <text x="60" y="150" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18"
        font-weight="700" fill="#F7F7F8">① 色彩令牌</text>
  <g font-family="Menlo, monospace" font-size="11" fill="#8E8E93">
    <text x="60" y="178">token</text>
    <text x="270" y="178">Mac Light</text>
    <text x="345" y="178">Mac Dark</text>
    <text x="420" y="178">手表</text>
    <text x="500" y="178" font-family="Helvetica Neue, PingFang SC, sans-serif">用途 / 备注</text>
  </g>
  <g font-family="Menlo, monospace" font-size="12" fill="#ECECF1">
    <!-- row template: swatch 44×28 rx6 at x=270/345/420, token at x=60 baseline+19, usage x=500 -->
    <text x="60" y="215">brand.primary</text>
    <rect x="270" y="196" width="44" height="28" rx="6" fill="#F5A623" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="196" width="44" height="28" rx="6" fill="#F5A623" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="196" width="44" height="28" rx="6" fill="#F5A623" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="215" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">品牌露出点 / 手表主操作（浅底文字用 #D9820B）</text>

    <text x="60" y="255">accent.system</text>
    <rect x="270" y="236" width="44" height="28" rx="6" fill="#007AFF" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="236" width="44" height="28" rx="6" fill="#0A84FF" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="420" y="255" fill="#6E6E73">—</text>
    <text x="500" y="255" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">Mac 常规主操作（systemBlue，HIG）</text>

    <text x="60" y="295">state.recording</text>
    <rect x="270" y="276" width="44" height="28" rx="6" fill="#E5484D" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="276" width="44" height="28" rx="6" fill="#E5484D" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="276" width="44" height="28" rx="6" fill="#E5484D" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="295" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">录音态 / REC 指示（两端一致）</text>

    <text x="60" y="335">state.sync</text>
    <rect x="270" y="316" width="44" height="28" rx="6" fill="#007AFF" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="316" width="44" height="28" rx="6" fill="#0A84FF" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="316" width="44" height="28" rx="6" fill="#0A84FF" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="335" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">连接 / 同步</text>

    <text x="60" y="375">state.success</text>
    <rect x="270" y="356" width="44" height="28" rx="6" fill="#28A745" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="356" width="44" height="28" rx="6" fill="#32D74B" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="356" width="44" height="28" rx="6" fill="#30D158" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="375" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">校验通过 / 完成</text>

    <text x="60" y="415">state.warning</text>
    <rect x="270" y="396" width="44" height="28" rx="6" fill="#FF9500" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="396" width="44" height="28" rx="6" fill="#FF9F0A" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="396" width="44" height="28" rx="6" fill="#FF9F0A" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="415" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">低电 / 告警</text>

    <text x="60" y="455">state.danger</text>
    <rect x="270" y="436" width="44" height="28" rx="6" fill="#FF3B30" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="436" width="44" height="28" rx="6" fill="#FF453A" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="436" width="44" height="28" rx="6" fill="#E5484D" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="455" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">删除 / 错误</text>

    <text x="60" y="495">surface.bg</text>
    <rect x="270" y="476" width="44" height="28" rx="6" fill="#ECECEE" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="476" width="44" height="28" rx="6" fill="#1E1E1E" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="476" width="44" height="28" rx="6" fill="#000000" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="495" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">页面背景（Mac 用系统色；手表纯黑省电）</text>

    <text x="60" y="535">surface.card</text>
    <rect x="270" y="516" width="44" height="28" rx="6" fill="#FFFFFF" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="516" width="44" height="28" rx="6" fill="#1C1C1E" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="516" width="44" height="28" rx="6" fill="#1C1C1E" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="535" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">卡片</text>

    <text x="60" y="575">surface.card2</text>
    <rect x="270" y="556" width="44" height="28" rx="6" fill="#F5F5F7" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="556" width="44" height="28" rx="6" fill="#2C2C2E" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="556" width="44" height="28" rx="6" fill="#2C2C2E" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">次级填充 / 轨道</text>

    <text x="60" y="615">text.primary</text>
    <rect x="270" y="596" width="44" height="28" rx="6" fill="#1D1D1F" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="596" width="44" height="28" rx="6" fill="#F5F5F7" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="596" width="44" height="28" rx="6" fill="#ECECF1" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="615" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">正文（Mac 用 labelColor）</text>

    <text x="60" y="655">text.secondary</text>
    <rect x="270" y="636" width="44" height="28" rx="6" fill="#6E6E73" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="636" width="44" height="28" rx="6" fill="#9A9AA2" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="636" width="44" height="28" rx="6" fill="#9A9AA2" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="655" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">辅助</text>

    <text x="60" y="695">text.tertiary</text>
    <rect x="270" y="676" width="44" height="28" rx="6" fill="#8E8E93" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="345" y="676" width="44" height="28" rx="6" fill="#6E6E73" stroke="#2A2A2E" stroke-width="0.5"/>
    <rect x="420" y="676" width="44" height="28" rx="6" fill="#6E6E73" stroke="#2A2A2E" stroke-width="0.5"/>
    <text x="500" y="695" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="12" fill="#9A9AA2">弱提示 · 对比度底线：正文 ≥ 4.5:1，琥珀底文字用墨黑</text>
  </g>

  <!-- ② 字体标尺 -->
  <text x="60" y="772" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18"
        font-weight="700" fill="#F7F7F8">② 字体标尺</text>
  <g font-family="Helvetica Neue, PingFang SC, sans-serif" fill="#ECECF1">
    <text x="60" y="812" font-size="22" font-weight="700">页面标题 <tspan font-size="10" fill="#6E6E73">.title2 · 22/700</tspan></text>
    <text x="60" y="842" font-size="13" font-weight="600">分组标题 <tspan font-size="10" fill="#6E6E73">.headline · 13/600</tspan></text>
    <text x="60" y="866" font-size="13">正文列表 <tspan font-size="10" fill="#6E6E73">.body · 13/400</tspan></text>
    <text x="60" y="888" font-size="12" fill="#C7C7CC">辅助说明 <tspan font-size="10" fill="#6E6E73">.callout · 12/400</tspan></text>
    <text x="60" y="908" font-size="11" fill="#9A9AA2">弱提示 <tspan font-size="10" fill="#6E6E73">.caption · 11/400</tspan></text>
    <text x="60" y="932" font-size="12" font-family="Menlo, monospace">be ec 03 40 07 ff <tspan font-size="10" fill="#6E6E73">Menlo 12 · 控制台</tspan></text>
    <text x="60" y="960" font-size="18">0123456789 <tspan font-size="10" fill="#6E6E73">tabular · 计时/数值</tspan></text>
  </g>
  <g font-family="Helvetica Neue, PingFang SC, sans-serif" fill="#ECECF1">
    <text x="620" y="836" font-size="56" font-weight="200">14:05</text>
    <text x="830" y="836" font-size="10" fill="#6E6E73">display · Montserrat 64/200（图示 56）</text>
    <text x="620" y="896" font-size="40" font-weight="200">00:12:34</text>
    <text x="830" y="896" font-size="10" fill="#6E6E73">timer · Montserrat 56/200（图示 40）</text>
    <text x="620" y="932" font-size="15" font-weight="600">页面标题 <tspan font-size="10" fill="#6E6E73">title · 思源 15/600</tspan></text>
    <text x="620" y="956" font-size="13">录音列表正文 <tspan font-size="10" fill="#6E6E73">body · 思源 13/400</tspan></text>
    <text x="620" y="976" font-size="11" fill="#C7C7CC">辅助说明 <tspan font-size="10" fill="#6E6E73">caption · 11/400</tspan></text>
    <text x="620" y="994" font-size="10" fill="#9A9AA2">仅提示语 <tspan font-size="10" fill="#6E6E73">tiny · 10/400</tspan></text>
  </g>
  <line x1="580" y1="780" x2="580" y2="1010" stroke="#2A2A2E" stroke-width="1"/>
  <line x1="1080" y1="780" x2="1080" y2="1010" stroke="#2A2A2E" stroke-width="1"/>
  <text x="60" y="750" font-size="12" fill="#8E8E93" font-family="Helvetica Neue, PingFang SC, sans-serif">Mac（左，SwiftUI 系统样式）· 手表（右，LVGL 字号）</text>

  <!-- ③ 间距与圆角 -->
  <text x="1120" y="772" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18"
        font-weight="700" fill="#F7F7F8">③ 间距与圆角</text>
  <g font-family="Menlo, monospace" font-size="10" fill="#8E8E93">
    <rect x="1120" y="792" width="12" height="12" fill="#F5A623"/><text x="1220" y="802">space.1 · 4</text>
    <rect x="1120" y="810" width="24" height="12" fill="#F5A623"/><text x="1220" y="820">space.2 · 8</text>
    <rect x="1120" y="828" width="36" height="12" fill="#F5A623"/><text x="1220" y="838">space.3 · 12</text>
    <rect x="1120" y="846" width="48" height="12" fill="#F5A623"/><text x="1220" y="856">space.4 · 16</text>
    <rect x="1120" y="864" width="60" height="12" fill="#F5A623"/><text x="1220" y="874">space.5 · 20</text>
    <rect x="1120" y="882" width="72" height="12" fill="#F5A623"/><text x="1220" y="892">space.6 · 24</text>
    <rect x="1120" y="900" width="96" height="12" fill="#F5A623"/><text x="1220" y="910">space.8 · 32</text>
  </g>
  <g font-family="Menlo, monospace" font-size="10" fill="#8E8E93">
    <rect x="1120" y="934" width="44" height="44" rx="6" fill="#2C2C2E"/><text x="1120" y="992">r.sm 6</text>
    <rect x="1196" y="934" width="44" height="44" rx="10" fill="#2C2C2E"/><text x="1196" y="992">r.md 10</text>
    <rect x="1272" y="934" width="44" height="44" rx="14" fill="#2C2C2E"/><text x="1272" y="992">r.lg 14</text>
    <rect x="1348" y="934" width="44" height="44" rx="20" fill="#2C2C2E"/><text x="1348" y="992">r.xl 20</text>
    <circle cx="1446" cy="956" r="22" fill="#2C2C2E"/><text x="1424" y="992">r.full</text>
  </g>

  <!-- ④ 动效 -->
  <text x="1120" y="1046" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18"
        font-weight="700" fill="#F7F7F8">④ 动效</text>
  <g font-family="Menlo, monospace" font-size="10" fill="#8E8E93">
    <rect x="1120" y="1064" width="40" height="14" rx="7" fill="#0A84FF"/><text x="1300" y="1075">motion.micro · 100ms 按压</text>
    <rect x="1120" y="1086" width="60" height="14" rx="7" fill="#0A84FF"/><text x="1300" y="1097">motion.fast · 150ms toast</text>
    <rect x="1120" y="1108" width="100" height="14" rx="7" fill="#0A84FF"/><text x="1300" y="1119">motion.normal · 250ms 页面</text>
    <rect x="1120" y="1130" width="160" height="14" rx="7" fill="#0A84FF"/><text x="1300" y="1141">motion.slow · 400ms 少用</text>
  </g>
  <text x="1120" y="1176" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="11"
        fill="#9A9AA2">缓动 ease-out · REC pulse 1200ms 循环 · 手表禁 overshoot</text>
</svg>
