    <text x="740" y="670" fill="#007AFF">下载中 = accent + 迷你进度</text>
    <text x="740" y="710" fill="#34C759">✓ 已校验 = success</text>
    <text x="740" y="730" fill="#FF3B30">失败 = danger + 重试按钮</text>
    <text x="740" y="770">AX: device.fileTable.row.{fileName}</text>
    <text x="740" y="790">行内操作必须真实 button（R6）</text>
  </g>

