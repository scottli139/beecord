name: mac-test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Pin Xcode to the version used for local development. macos-26 images
      # preinstall several 26.x releases; the default may drift, so select
      # explicitly. Update the path when bumping the required version.
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Run BuzzLink package tests
        run: |
          cd apps/mac/Packages/BuzzLink
          swift test

      - name: Run BeecordStudio unit tests
        run: |
          cd apps/mac
          # UITestSimServer 依赖 40404 回环端口；先记录占用者便于失败时归因
          lsof -nP -iTCP:40404 -sTCP:LISTEN || true
          xcodebuild test -scheme BeecordStudio \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # 失败时上传 xcresult（含截图/AX 树/完整日志），UI 测试现场的唯一可靠来源
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-results
          path: apps/mac/TestResults.xcresult
          retention-days: 7
