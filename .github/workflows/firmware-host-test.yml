name: firmware-host-test

on:
  push:
    branches: [main]
    paths: ['firmware/main/proto/**', 'firmware/main/audio/**', 'firmware/test_host/**', 'tools/**',
            'apps/mac/Packages/BuzzLink/Tests/**', '.github/workflows/firmware-host-test.yml']
  pull_request:
    paths: ['firmware/main/proto/**', 'firmware/main/audio/**', 'firmware/test_host/**', 'tools/**',
            'apps/mac/Packages/BuzzLink/Tests/**', '.github/workflows/firmware-host-test.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 协议层宿主单测：ubuntu + gcc（本机对应门禁为 macOS + clang，见 firmware/test_host/Makefile）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # M3 rec_pipe roundtrip 宿主测试需真链接 libopus（Makefile 按 pkg-config 检测，
      # 预装保证用例在 CI 真实执行，不静默跳过）
      - name: Prepare host libopus
        run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config

      - name: Run host protocol tests
        run: make CC=gcc -C firmware/test_host test
